{% extends "base.html" %}

{% block content %}

<section class="contact-page">

    <div class="container">

        <!-- ======================================
                    Header
        ======================================= -->

        <div class="text-center mb-5">

            <h1 class="page-title">

                Contact Us

            </h1>

            <p class="page-subtitle">

                Have questions or suggestions? We'd love to hear from you.

            </p>

        </div>

        <div class="row g-5">

            <!-- ======================================
                    Contact Form
            ======================================= -->

            <div class="col-lg-7">

                <div class="contact-card">

                    <h3>

                        Send a Message

                    </h3>

                    <hr>

                    <form id="contact-form">

                        <div class="mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">

                                Subject

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="subject"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">

                                Message

                            </label>

                            <textarea
                                class="form-control"
                                rows="6"
                                id="message"
                                required></textarea>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            <i class="fas fa-paper-plane me-2"></i>

                            Send Message

                        </button>

                    </form>

                </div>

            </div>

            <!-- ======================================
                    Contact Info
            ======================================= -->

            <div class="col-lg-5">

                <div class="contact-card mb-4">

                    <h3>

                        Contact Information

                    </h3>

                    <hr>

                    <p>

                        <i class="fas fa-envelope me-2 text-success"></i>

                        support@stockvisionai.com

                    </p>

                    <p>

                        <i class="fas fa-globe me-2 text-success"></i>

                        www.stockvisionai.com

                    </p>

                    <p>

                        <i class="fas fa-map-marker-alt me-2 text-success"></i>

                        Chennai, India

                    </p>

                </div>

                <div class="contact-card">

                    <h3>

                        Connect With Us

                    </h3>

                    <hr>

                    <div class="social-icons">

                        <a href="#">

                            <i class="fab fa-github"></i>

                        </a>

                        <a href="#">

                            <i class="fab fa-linkedin"></i>

                        </a>

                        <a href="#">

                            <i class="fab fa-twitter"></i>

                        </a>

                        <a href="#">

                            <i class="fab fa-youtube"></i>

                        </a>

                    </div>

                    <div class="map-placeholder mt-4">

                        <i class="fas fa-map-marked-alt"></i>

                        <p class="mt-3">

                            Google Maps integration will appear here.

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
