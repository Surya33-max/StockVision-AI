<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-UA-Compatible"
          content="IE=edge">

    <meta name="description"
          content="StockVision AI - AI Powered Stock Market Analytics and Prediction Platform">

    <meta name="keywords"
          content="Stocks, AI, Machine Learning, Finance, Flask, Prediction">

    <meta name="author"
          content="Surya">

    <title>

        {% if page_title %}

            {{ page_title }} | {{ app_name }}

        {% else %}

            {{ app_name }}

        {% endif %}

    </title>

    <!-- ===========================
            Bootstrap
    ============================ -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- ===========================
            Font Awesome
    ============================ -->

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- ===========================
            Google Fonts
    ============================ -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

    <!-- ===========================
            Custom CSS
    ============================ -->

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <!-- ===========================
            Plotly
    ============================ -->

    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

</head>

<body>

    <!-- ===========================
            Navigation
    ============================ -->

    {% include 'navbar.html' %}

    <!-- ===========================
            Main Content
    ============================ -->

    <main class="main-content">

        {% block content %}

        {% endblock %}

    </main>

    <!-- ===========================
            Footer
    ============================ -->

    {% include 'footer.html' %}

    <!-- ===========================
            Bootstrap JS
    ============================ -->

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ===========================
            Custom JS
    ============================ -->

    <script
    src="{{ url_for('static', filename='js/main.js') }}">
    </script>

    <script
    src="{{ url_for('static', filename='js/dashboard.js') }}">
    </script>

    <script
    src="{{ url_for('static', filename='js/chart.js') }}">
    </script>

</body>

</html>
